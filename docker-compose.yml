services:
  postgres:
    image: postgres:16-alpine
    container_name: barangay-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barangay
      POSTGRES_PASSWORD: barangay
      POSTGRES_DB: barangay_booking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - barangay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barangay -d barangay_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  barangay-postgres-data:
